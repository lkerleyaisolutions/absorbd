<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Absorbd Data Journey Tree</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #64748b;
      --line: #94a3b8;
      --bg: #f8fafc;
      --panel: #ffffff;
      --blue: #dbeafe;
      --blue-stroke: #2563eb;
      --gray: #e5e7eb;
      --gray-stroke: #6b7280;
      --purple: #ede9fe;
      --purple-stroke: #7c3aed;
      --teal: #ccfbf1;
      --teal-stroke: #0f766e;
      --orange: #ffedd5;
      --orange-stroke: #f97316;
      --green: #dcfce7;
      --green-stroke: #16a34a;
      --yellow: #fef9c3;
      --yellow-stroke: #ca8a04;
      --red: #fee2e2;
      --red-stroke: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .page {
      width: min(100vw, 2200px);
      margin: 0 auto;
      padding: 18px;
    }

    .sheet {
      background: var(--panel);
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.10);
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .title {
      font-size: 34px;
      font-weight: 780;
      letter-spacing: 0;
      fill: #0f172a;
    }

    .subtitle {
      font-size: 15px;
      fill: var(--muted);
    }

    .layer-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      fill: #334155;
    }

    .lane {
      fill: #f8fafc;
      stroke: #e2e8f0;
      stroke-width: 1.5;
    }

    .node {
      stroke-width: 2;
      filter: drop-shadow(0 8px 16px rgba(15, 23, 42, 0.08));
    }

    .node-title {
      color: #0f172a;
      font-size: 15px;
      font-weight: 760;
      line-height: 1.2;
      margin: 0 0 6px;
    }

    .node-body {
      color: #334155;
      font-size: 12.2px;
      line-height: 1.25;
      margin: 0;
    }

    .tiny-title {
      color: #0f172a;
      font-size: 11px;
      font-weight: 780;
      line-height: 1.1;
      margin: 0;
      text-align: center;
    }

    .tiny-body {
      color: #475569;
      font-size: 9.4px;
      line-height: 1.1;
      margin: 2px 0 0;
      text-align: center;
    }

    .arrow {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.2;
      marker-end: url(#arrowHead);
    }

    .arrow-teal {
      stroke: var(--teal-stroke);
    }

    .arrow-purple {
      stroke: var(--purple-stroke);
    }

    .arrow-orange {
      stroke: var(--orange-stroke);
    }

    .arrow-red {
      stroke: var(--red-stroke);
    }

    .arrow-label-box {
      fill: rgba(255, 255, 255, 0.72);
      stroke: rgba(148, 163, 184, 0.42);
      stroke-width: 1;
      rx: 6;
    }

    .arrow-label {
      fill: #64748b;
      font-size: 9.6px;
      font-weight: 620;
    }

    .callout-title {
      font-size: 14px;
      font-weight: 820;
      fill: #0f172a;
    }

    .callout-body {
      font-size: 11.2px;
      fill: #334155;
    }

    .legend-text {
      font-size: 11px;
      fill: #334155;
      font-weight: 650;
    }

    @media print {
      body {
        background: #ffffff;
      }

      .page {
        padding: 0;
        width: 100%;
      }

      .sheet {
        border: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="sheet" aria-label="Absorbd information flow diagram">
      <svg viewBox="0 0 2200 1420" role="img" aria-labelledby="diagramTitle diagramDesc">
        <title id="diagramTitle">Absorbd: How Patient Information Becomes a Grounded Nutrition Protocol</title>
        <desc id="diagramDesc">A left-to-right data journey tree showing inputs, processing, and outputs for a nine-agent clinical nutrition reasoning system.</desc>

        <defs>
          <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"></path>
          </marker>

          <g id="loopMotif">
            <rect x="0" y="0" width="66" height="42" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.4"></rect>
            <text x="33" y="25" text-anchor="middle" class="arrow-label">PLAN</text>
            <rect x="76" y="0" width="82" height="42" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"></rect>
            <text x="117" y="25" text-anchor="middle" class="arrow-label">RETRIEVE</text>
            <rect x="168" y="0" width="78" height="42" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.4"></rect>
            <text x="207" y="25" text-anchor="middle" class="arrow-label">ANALYZE</text>
            <rect x="256" y="0" width="76" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"></rect>
            <text x="294" y="25" text-anchor="middle" class="arrow-label">VERIFY</text>
            <rect x="342" y="0" width="86" height="42" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.4"></rect>
            <text x="385" y="25" text-anchor="middle" class="arrow-label">CONCLUDE</text>
            <path d="M66 21 H76 M158 21 H168 M246 21 H256 M332 21 H342" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowHead)" fill="none"></path>
          </g>
        </defs>

        <rect width="2200" height="1420" fill="#ffffff"></rect>
        <text x="60" y="58" class="title">Absorbd: How Patient Information Becomes a Grounded Nutrition Protocol</text>
        <text x="60" y="86" class="subtitle">Three-layer data journey tree for a 9-agent clinical nutrition reasoning system for IBD patients.</text>

        <rect x="55" y="112" width="520" height="1238" rx="18" class="lane"></rect>
        <rect x="605" y="112" width="980" height="1238" rx="18" class="lane"></rect>
        <rect x="1615" y="112" width="530" height="1238" rx="18" class="lane"></rect>
        <text x="82" y="148" class="layer-title">INPUTS</text>
        <text x="632" y="148" class="layer-title">PROCESSING</text>
        <text x="1642" y="148" class="layer-title">OUTPUTS</text>

        <g id="legend">
          <rect x="1374" y="34" width="720" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0"></rect>
          <rect x="1392" y="52" width="22" height="14" rx="4" fill="#dbeafe" stroke="#2563eb"></rect>
          <text x="1421" y="64" class="legend-text">human input</text>
          <rect x="1510" y="52" width="22" height="14" rx="4" fill="#e5e7eb" stroke="#6b7280"></rect>
          <text x="1539" y="64" class="legend-text">storage</text>
          <rect x="1608" y="52" width="22" height="14" rx="4" fill="#ede9fe" stroke="#7c3aed"></rect>
          <text x="1637" y="64" class="legend-text">AI agent</text>
          <rect x="1712" y="52" width="22" height="14" rx="4" fill="#ccfbf1" stroke="#0f766e"></rect>
          <text x="1741" y="64" class="legend-text">retrieval</text>
          <rect x="1826" y="52" width="22" height="14" rx="4" fill="#ffedd5" stroke="#f97316"></rect>
          <text x="1855" y="64" class="legend-text">output</text>
          <rect x="1932" y="52" width="18" height="14" rx="4" fill="#dcfce7" stroke="#16a34a"></rect>
          <rect x="1954" y="52" width="18" height="14" rx="4" fill="#fef9c3" stroke="#ca8a04"></rect>
          <rect x="1976" y="52" width="18" height="14" rx="4" fill="#fee2e2" stroke="#dc2626"></rect>
          <text x="2002" y="64" class="legend-text">priority</text>
        </g>

        <!-- Input layer nodes -->
        <g id="doctor-input">
          <rect x="90" y="180" width="260" height="122" rx="12" class="node" fill="#dbeafe" stroke="#2563eb"></rect>
          <foreignObject x="108" y="198" width="224" height="88">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Doctor Input</p>
              <p class="node-body">Patient profile: UC, Crohn's, or Celiac, medications, symptoms to watch, dietary restrictions, clinical notes.</p>
            </div>
          </foreignObject>
        </g>

        <g id="profile-db">
          <rect x="385" y="198" width="155" height="74" rx="12" class="node" fill="#e5e7eb" stroke="#6b7280"></rect>
          <foreignObject x="398" y="214" width="128" height="44">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">SQLite</p>
              <p class="node-body">patient profile</p>
            </div>
          </foreignObject>
        </g>

        <g id="lab-upload">
          <rect x="90" y="342" width="260" height="118" rx="12" class="node" fill="#dbeafe" stroke="#2563eb"></rect>
          <foreignObject x="108" y="360" width="224" height="84">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Lab Document Upload</p>
              <p class="node-body">Doctor or patient uploads lab PDFs across 11 document types.</p>
            </div>
          </foreignObject>
        </g>

        <g id="doc-ingestion">
          <rect x="385" y="326" width="155" height="150" rx="12" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="398" y="342" width="128" height="118">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Document Ingestion</p>
              <p class="node-body">pdfplumber text extraction, LLM lab value extraction, chunking, embedding, and patient_id tagging.</p>
            </div>
          </foreignObject>
        </g>

        <g id="doctor-gate">
          <rect x="90" y="500" width="260" height="96" rx="12" class="node" fill="#dbeafe" stroke="#2563eb"></rect>
          <foreignObject x="108" y="518" width="224" height="60">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Doctor Confirmation Gate</p>
              <p class="node-body">Only doctor-approved lab values proceed.</p>
            </div>
          </foreignObject>
        </g>

        <g id="lab-db">
          <rect x="385" y="512" width="155" height="72" rx="12" class="node" fill="#e5e7eb" stroke="#6b7280"></rect>
          <foreignObject x="398" y="527" width="128" height="42">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">SQLite</p>
              <p class="node-body">lab_values table</p>
            </div>
          </foreignObject>
        </g>

        <g id="patient-doc-index">
          <rect x="385" y="620" width="155" height="96" rx="12" class="node" fill="#ccfbf1" stroke="#0f766e"></rect>
          <foreignObject x="398" y="636" width="128" height="68">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Azure AI Search</p>
              <p class="node-body">patient-uploaded docs, tagged by patient_id</p>
            </div>
          </foreignObject>
        </g>

        <g id="journal">
          <rect x="90" y="748" width="260" height="126" rx="12" class="node" fill="#dbeafe" stroke="#2563eb"></rect>
          <foreignObject x="108" y="766" width="224" height="92">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Patient Daily Journal</p>
              <p class="node-body">Conversational check-in: symptoms, meds taken or missed, food, sleep, stool count, stress, exercise, notes.</p>
            </div>
          </foreignObject>
        </g>

        <g id="journal-db">
          <rect x="385" y="776" width="155" height="72" rx="12" class="node" fill="#e5e7eb" stroke="#6b7280"></rect>
          <foreignObject x="398" y="791" width="128" height="42">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">SQLite</p>
              <p class="node-body">journal_entries</p>
            </div>
          </foreignObject>
        </g>

        <g id="knowledge-base">
          <rect x="90" y="930" width="260" height="132" rx="12" class="node" fill="#ccfbf1" stroke="#0f766e"></rect>
          <foreignObject x="108" y="948" width="224" height="96">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Clinical Knowledge Base</p>
              <p class="node-body">Built offline one time: 13 NIH ODS fact sheets, 15 FDA DailyMed labels, 14 IBD correlation studies.</p>
            </div>
          </foreignObject>
        </g>

        <g id="literature-index">
          <rect x="385" y="940" width="155" height="112" rx="12" class="node" fill="#ccfbf1" stroke="#0f766e"></rect>
          <foreignObject x="398" y="956" width="128" height="80">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Azure AI Search</p>
              <p class="node-body">general literature index, no patient tag</p>
            </div>
          </foreignObject>
        </g>

        <g id="access-code">
          <rect x="90" y="1110" width="260" height="94" rx="12" class="node" fill="#dbeafe" stroke="#2563eb"></rect>
          <foreignObject x="108" y="1128" width="224" height="58">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Patient Access Code Entry</p>
              <p class="node-body">Links patient to the doctor-created profile.</p>
            </div>
          </foreignObject>
        </g>

        <!-- Processing layer nodes -->
        <g id="profile-prep">
          <rect x="650" y="192" width="310" height="154" rx="14" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="670" y="211" width="270" height="116">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Profile Preparation</p>
              <p class="node-body">Merges patient profile, confirmed lab values, latest journal symptoms, brand-to-generic medication normalization, and active inflammation flag from CRP or calprotectin.</p>
            </div>
          </foreignObject>
        </g>

        <g id="retrieval">
          <rect x="1020" y="182" width="320" height="174" rx="16" class="node" fill="#ccfbf1" stroke="#0f766e"></rect>
          <foreignObject x="1040" y="202" width="280" height="132">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Foundry IQ Knowledge Retrieval</p>
              <p class="node-body">Azure AI Search agentic retrieval blends two sources per query: general clinical literature plus this patient's uploaded documents with a patient_id filter.</p>
            </div>
          </foreignObject>
        </g>

        <text x="650" y="390" class="subtitle">Agents 3-9 are shown after profile preparation and access-code linking.</text>

        <g id="agent3">
          <rect x="650" y="430" width="430" height="154" rx="14" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="670" y="450" width="390" height="68">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Agent 3 Deficiency Hypothesis</p>
              <p class="node-body">Condition, symptoms, and lab values become deficiency candidates.</p>
            </div>
          </foreignObject>
          <use href="#loopMotif" x="670" y="526"></use>
        </g>

        <g id="agent4">
          <rect x="650" y="625" width="430" height="154" rx="14" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="670" y="645" width="390" height="68">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Agent 4 Medication Interaction</p>
              <p class="node-body">Each medication becomes drug-nutrient depletion hypotheses.</p>
            </div>
          </foreignObject>
          <use href="#loopMotif" x="670" y="721"></use>
        </g>

        <g id="agent5">
          <rect x="650" y="820" width="430" height="154" rx="14" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="670" y="840" width="390" height="68">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Agent 5 Dietary Gap</p>
              <p class="node-body">Each dietary restriction becomes nutrient gap hypotheses.</p>
            </div>
          </foreignObject>
          <use href="#loopMotif" x="670" y="916"></use>
        </g>

        <g id="verify-callout">
          <rect x="1115" y="520" width="265" height="168" rx="14" fill="#fff7ed" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="8 5"></rect>
          <text x="1135" y="550" class="callout-title">Differentiator 1</text>
          <text x="1135" y="576" class="callout-title">Adversarial VERIFY</text>
          <text x="1135" y="603" class="callout-body">Every branch tests cited evidence</text>
          <text x="1135" y="622" class="callout-body">against the proposed finding.</text>
          <text x="1135" y="649" class="callout-body">Unsupported claims are dropped</text>
          <text x="1135" y="668" class="callout-body">before synthesis or protocol output.</text>
        </g>

        <g id="agent6">
          <rect x="1130" y="760" width="365" height="146" rx="14" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="1150" y="779" width="325" height="72">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Agent 6 Synthesis</p>
              <p class="node-body">Deterministic merge counts how many independent pathways converge on each nutrient.</p>
            </div>
          </foreignObject>
          <rect x="1152" y="858" width="86" height="30" rx="8" fill="#fee2e2" stroke="#dc2626"></rect>
          <text x="1195" y="878" text-anchor="middle" class="arrow-label">RED</text>
          <rect x="1254" y="858" width="98" height="30" rx="8" fill="#fef9c3" stroke="#ca8a04"></rect>
          <text x="1303" y="878" text-anchor="middle" class="arrow-label">YELLOW</text>
          <rect x="1368" y="858" width="86" height="30" rx="8" fill="#dcfce7" stroke="#16a34a"></rect>
          <text x="1411" y="878" text-anchor="middle" class="arrow-label">GREEN</text>
        </g>

        <g id="agent7">
          <rect x="1130" y="947" width="365" height="126" rx="14" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="1150" y="966" width="325" height="88">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Agent 7 Protocol</p>
              <p class="node-body">For each RED or YELLOW nutrient, retrieves dosing evidence, then proposes dose, form, timing, and evidence level.</p>
            </div>
          </foreignObject>
        </g>

        <g id="agent8">
          <rect x="1130" y="1112" width="365" height="126" rx="14" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="1150" y="1131" width="325" height="88">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Agent 8 Safety</p>
              <p class="node-body">Checks red-flag escalation, retrieves tolerable upper limits, caps high doses, and blocks ungrounded recommendations.</p>
            </div>
          </foreignObject>
        </g>

        <g id="agent9">
          <rect x="1130" y="1275" width="365" height="100" rx="14" class="node" fill="#ede9fe" stroke="#7c3aed"></rect>
          <foreignObject x="1150" y="1294" width="325" height="64">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Agent 9 Doctor Guide</p>
              <p class="node-body">Prioritizes top issues into 3 appointment questions plus patient action items.</p>
            </div>
          </foreignObject>
        </g>

        <g id="stats-engine">
          <rect x="660" y="1118" width="330" height="126" rx="14" class="node" fill="#ffffff" stroke="#475569"></rect>
          <foreignObject x="680" y="1137" width="290" height="88">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Statistical Correlation Engine</p>
              <p class="node-body">Not an LLM. Computes lagged Spearman correlations between behaviors and symptoms as observational, not causal, patterns.</p>
            </div>
          </foreignObject>
        </g>

        <g id="retrieval-callout">
          <rect x="1370" y="190" width="185" height="158" rx="14" fill="#ecfeff" stroke="#0f766e" stroke-width="2.4" stroke-dasharray="8 5"></rect>
          <text x="1390" y="220" class="callout-title">Differentiator 2</text>
          <text x="1390" y="246" class="callout-title">Blended Retrieval</text>
          <text x="1390" y="273" class="callout-body">Every query uses clinical</text>
          <text x="1390" y="292" class="callout-body">literature plus patient</text>
          <text x="1390" y="311" class="callout-body">documents filtered by</text>
          <text x="1390" y="330" class="callout-body">patient_id.</text>
        </g>

        <!-- Output layer nodes -->
        <g id="trace-output">
          <rect x="1650" y="182" width="420" height="92" rx="12" class="node" fill="#ffedd5" stroke="#f97316"></rect>
          <foreignObject x="1670" y="201" width="380" height="56">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Live Streaming Reasoning Trace</p>
              <p class="node-body">Every agent step is visible in real time in the UI.</p>
            </div>
          </foreignObject>
        </g>

        <g id="escalation-output">
          <rect x="1650" y="314" width="420" height="86" rx="12" class="node" fill="#fee2e2" stroke="#dc2626"></rect>
          <foreignObject x="1670" y="332" width="380" height="50">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Urgent Escalation Banner</p>
              <p class="node-body">Shown when red-flag symptoms are detected.</p>
            </div>
          </foreignObject>
        </g>

        <g id="protocol-output">
          <rect x="1650" y="445" width="420" height="128" rx="12" class="node" fill="#ffedd5" stroke="#f97316"></rect>
          <foreignObject x="1670" y="464" width="380" height="88">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Prioritized Supplement Protocol Cards</p>
              <p class="node-body">RED, YELLOW, and GREEN cards with dose, form, timing, cautions, and citations back to knowledge sources.</p>
            </div>
          </foreignObject>
        </g>

        <g id="questions-output">
          <rect x="1650" y="625" width="420" height="96" rx="12" class="node" fill="#ffedd5" stroke="#f97316"></rect>
          <foreignObject x="1670" y="644" width="380" height="58">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <p class="node-title">Doctor Visit Questions and Action List</p>
              <p class="node-body">3 tailored questions plus patient action items.</p>
            </div>
          </foreignObject>
